[package]
name = "nc-gpodder-lite"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.6.0"
axum = { version = "0.8", features = ["macros"] }
base64 = "0.23.1"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive", "env"] }
html-escape = "0.3.0"
quick-xml = "0.42.0"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "system-proxy"] }
rpassword = "7.5.4"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = "0.5.3"

# The nextcloud-gpodder revision this server is feature-compatible with.
# Updated by the `sync-upstream` skill (.claude/skills/sync-upstream).
[package.metadata.upstream]
repository = "https://github.com/thrillfall/nextcloud-gpodder"
version = "3.18.0"
commit = "1f190b3438ec68224eef2635e7d675e564eb8617"
