# Configure via a .env file next to this one; see .env.example.
services:
  nc-gpodder-lite:
    build: .
    image: nc-gpodder-lite
    restart: unless-stopped
    ports:
      - "${NCGL_PORT:-8080}:8080"
    environment:
      NCGL_PUBLIC_URL: ${NCGL_PUBLIC_URL:-}
      NCGL_TRUSTED_PROXIES: ${NCGL_TRUSTED_PROXIES:-}
      NCGL_ALLOW_LOCAL_REMOTE_SERVERS: ${NCGL_ALLOW_LOCAL_REMOTE_SERVERS:-false}
      RUST_LOG: ${RUST_LOG:-nc_gpodder_lite=info,tower_http=info}
    volumes:
      - data:/data

volumes:
  data:
